<div class="container-fluid">
    <div class="row">
        <div class="col-8">
            <!-- User List -->
            <div class="card">
                <div class="card-header bg-primary">
                    <div class="row">
                        <div class="col-6 text-white">
                            <h6 class="p-2">User List</h6>
                        </div>
                        <div class="col-6 text-end">
                            <button class="btn btn-info">Add User</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <table class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>Department</th>
                                <th>Name</th>
                                <th>Gender</th>
                                <th>Mobile</th>
                                <th>Email</th>
                                <th>DOJ</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let item of userList">
                                <td>{{ item.department }}</td>
                                <td>{{ item.name }}</td>
                                <td>{{ item.gender }}</td>
                                <td>{{ item.mobile }}</td>
                                <td>{{ item.email }}</td>
                                <td>{{ item.doj }}</td>
                                <td>{{ item.status ? 'Active' : 'InActive' }}</td>
                                <td class="text-center">
                                    <i class="fa fa-edit text-primary" style="cursor: pointer;" (click)="onEdit(item)"></i> |
                                    <i class="fa fa-trash text-danger" style="cursor: pointer;" (click)="onDelete(item.id)"></i>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-4">
            <!-- User Form -->
            <div class="card">
                <div class="card-header bg-primary">
                    <div class="row">
                        <div class="col-6 text-white">
                            <h6 class="p-2">{{editMode ? "Update User" : "Add User"}}</h6>
                        </div>
                        <div class="col-6 text-end">
                            <button class="btn btn-info" (click)="onReset()">Reset</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
                        <div class="row g-3">
                            <div class="col-6">
                                <select class="form-select" formControlName="department" required>
                                    <option value="">Select Department</option>
                                    <option *ngFor="let item of departmentList" [value]="item">{{ item }}</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" formControlName="name" placeholder="Name">
                            </div>
                            <div class="col-6">
                                <input type="text" class="form-control" formControlName="mobile" placeholder="Mobile">
                            </div>
                            <div class="col-6">
                                <input type="email" class="form-control" formControlName="email" placeholder="Email">
                            </div>
                            <div class="col-6">
                                <input type="date" class="form-control" formControlName="doj" placeholder="DOJ">
                            </div>
                            <div class="col-6">
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" formControlName="gender" value="male">
                                    <label class="form-check-label">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" class="form-check-input" formControlName="gender" value="female">
                                    <label class="form-check-label">Female</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <input type="text" formControlName="city" class="form-control" placeholder="City">
                            </div>
                            <div class="col-6">
                                <input type="text" formControlName="salary" class="form-control" placeholder="Salary">
                            </div>
                            <div class="col-12">
                                <textarea cols="5" rows="3" formControlName="address" class="form-control" required placeholder="Address"></textarea>
                            </div>
                            <div class="col-12">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" formControlName="status">
                                    <label class="form-check-label">Active?</label>
                                </div>
                            </div>
                            <div class="col-12">
                                <button class="btn btn-primary w-100" type="submit">{{editMode ? "UPDATE" : "SAVE"}}</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
